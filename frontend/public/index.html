<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>M System</title>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link
        href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@600;700;900&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet">

    <style>
        :root {
            /* Dark Mode (Default) */
            --bg-main: #08090B;
            --bg-card: #15181E;
            --card-bg-gradient: linear-gradient(145deg, #15181E, #0C0E11);
            --text-main: #E6E6E6;
            --text-sub: #788296;
            --border-color: rgba(255, 255, 255, 0.06);
            --header-bg: rgba(8, 9, 11, 0.85);
            --modal-bg: #101216;
            --input-bg: rgba(255, 255, 255, 0.05);
            --icon-btn-bg: rgba(255, 255, 255, 0.03);
            --icon-btn-active: rgba(255, 255, 255, 0.1);
            --card-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);

            --safe-area-top: env(safe-area-inset-top);
            --safe-area-bottom: env(safe-area-inset-bottom);

            /* === 10种高级宝石配色 (RGB格式) === */
            --c-gold: 200, 170, 110;
            --c-blue: 0, 147, 255;
            --c-crimson: 255, 71, 87;
            --c-purple: 165, 94, 234;
            --c-emerald: 46, 213, 115;
            --c-silver: 192, 192, 192;
            --c-turquoise: 64, 224, 208;
            --c-amber: 255, 191, 0;
            --c-ruby: 224, 17, 95;
            --c-peridot: 154, 205, 50;
        }

        /* Light Mode */
        .light-mode {
            --bg-main: #F5F7FA;
            --bg-card: #FFFFFF;
            --card-bg-gradient: linear-gradient(145deg, #FFFFFF, #F0F2F5);
            --text-main: #2D3436;
            --text-sub: #636E72;
            --border-color: rgba(0, 0, 0, 0.08);
            --header-bg: rgba(245, 247, 250, 0.85);
            --modal-bg: #FFFFFF;
            --input-bg: rgba(0, 0, 0, 0.04);
            --icon-btn-bg: rgba(0, 0, 0, 0.04);
            --icon-btn-active: rgba(0, 0, 0, 0.08);
            --card-shadow: 0 4px 20px rgba(0, 0, 0, 0.08);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
            outline: none;
        }

        body {
            font-family: 'Inter', sans-serif;
            background-color: var(--bg-main);
            color: var(--text-main);
            min-height: 100vh;
            overflow-x: hidden;
            transition: background-color 0.3s, color 0.3s;
        }

        .filter-item {
            user-select: none;
            -webkit-user-select: none;
        }

        @keyframes fadeIn {
            from {
                opacity: 0;
                transform: translateY(10px);
            }

            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .fade-in {
            animation: fadeIn 0.4s ease forwards;
        }

        @keyframes star-bounce {
            0% {
                transform: scale(1);
            }

            50% {
                transform: scale(1.4);
            }

            100% {
                transform: scale(1);
            }
        }

        .star-anim {
            animation: star-bounce 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        @keyframes pulse-blue {
            0% {
                box-shadow: 0 0 0 0 rgba(0, 147, 255, 0.4);
            }

            70% {
                box-shadow: 0 0 0 10px rgba(0, 147, 255, 0);
            }

            100% {
                box-shadow: 0 0 0 0 rgba(0, 147, 255, 0);
            }
        }

        .ambient-top {
            position: fixed;
            top: -100px;
            left: -50px;
            width: 300px;
            height: 300px;
            background: radial-gradient(circle, rgba(var(--c-gold), 0.06), transparent 70%);
            filter: blur(60px);
            z-index: -1;
            transition: opacity 0.3s;
        }

        .ambient-bottom {
            position: fixed;
            bottom: -50px;
            right: -50px;
            width: 350px;
            height: 350px;
            background: radial-gradient(circle, rgba(var(--c-blue), 0.08), transparent 70%);
            filter: blur(70px);
            z-index: -1;
            transition: opacity 0.3s;
        }

        header {
            padding: calc(25px + var(--safe-area-top)) 24px 15px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            background: var(--header-bg);
            backdrop-filter: blur(12px);
            z-index: 100;
            position: sticky;
            top: 0;
            border-bottom: 1px solid var(--border-color);
            transition: background-color 0.3s, border-color 0.3s;
        }

        .brand {
            display: flex;
            flex-direction: column;
        }

        .brand-subtitle {
            font-size: 9px;
            letter-spacing: 4px;
            color: rgb(var(--c-gold));
            text-transform: uppercase;
            margin-bottom: 2px;
            font-weight: 600;
            opacity: 0.8;
        }

        .brand-title {
            font-family: 'Playfair Display', serif;
            font-size: 32px;
            font-weight: 700;
            color: var(--text-main);
            letter-spacing: 1px;
            line-height: 1.1;
        }

        .header-actions {
            display: flex;
            gap: 12px;
        }

        .icon-btn {
            width: 40px;
            height: 40px;
            border-radius: 12px;
            background: var(--icon-btn-bg);
            border: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-main);
            cursor: pointer;
            transition: all 0.3s;
        }

        .icon-btn:active {
            background: var(--icon-btn-active);
        }

        .filter-scroll {
            padding: 25px 24px;
            display: flex;
            gap: 24px;
            overflow-x: auto;
            scrollbar-width: none;
            align-items: center;
        }

        .filter-scroll::-webkit-scrollbar {
            display: none;
        }

        .filter-item {
            font-size: 14px;
            color: var(--text-sub);
            white-space: nowrap;
            position: relative;
            padding-bottom: 6px;
            font-family: 'Playfair Display', serif;
            letter-spacing: 0.5px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            gap: 6px;
            cursor: pointer;
        }

        .filter-item::before {
            content: '';
            width: 6px;
            height: 6px;
            border-radius: 50%;
            background: var(--text-sub);
            opacity: 0.3;
            transition: all 0.3s;
        }

        /* 动态生成颜色样式 */
        .filter-item.active-gold {
            color: rgb(var(--c-gold));
            font-weight: 600;
            font-style: italic;
        }

        .filter-item.active-gold::before {
            background: rgb(var(--c-gold));
            opacity: 1;
            box-shadow: 0 0 8px rgb(var(--c-gold));
        }

        .filter-item.active-gold::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 2px;
            background: rgb(var(--c-gold));
        }

        .tag-gold {
            color: rgb(var(--c-gold));
            background: rgba(var(--c-gold), 0.08);
            border: 1px solid rgba(var(--c-gold), 0.2);
        }

        .card.accent-gold::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 3px;
            height: 100%;
            background: rgb(var(--c-gold));
            box-shadow: 0 0 10px rgb(var(--c-gold));
        }

        .filter-item.active-blue {

        .add-tag-btn {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            border: 1px dashed var(--text-sub);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-sub);
            flex-shrink: 0;
            transition: all 0.3s;
            cursor: pointer;
        }

        .add-tag-btn:active {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            border-color: #fff;
        }

        .list-container {
            padding: 0 24px 120px;
            display: flex;
            flex-direction: column;
            gap: 24px;
            min-height: 50vh;
        }

        .card {
            background: var(--card-bg-gradient);
            border-radius: 4px;
            padding: 28px 24px;
            position: relative;
            border: 1px solid var(--border-color);
            box-shadow: var(--card-shadow);
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.1s, box-shadow 0.3s, background 0.3s, border-color 0.3s;
        }

        .card:active {
            transform: scale(0.98);
        }

        .card-top {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 18px;
        }

        .card-title {
            font-family: 'Playfair Display', serif;
            font-size: 18px;
            font-weight: 600;
            color: var(--text-main);
            letter-spacing: 0.5px;
        }

        .card-icon {
            color: var(--text-sub);
            cursor: pointer;
            transition: color 0.2s;
            font-size: 16px;
            padding: 5px;
        }

        .card-icon.starred {
            color: rgb(var(--c-gold));
            text-shadow: 0 0 10px rgba(var(--c-gold), 0.4);
        }

        .card-body {
            font-size: 13px;
            line-height: 1.8;
            color: var(--text-sub);
            font-weight: 300;
            margin-bottom: 24px;
            display: -webkit-box;
            -webkit-line-clamp: 3;
            -webkit-box-orient: vertical;
            overflow: hidden;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            border-top: 1px solid var(--border-color);
            padding-top: 16px;
        }

        .tag-pill {
            font-size: 10px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 12px;
            border-radius: 2px;
            backdrop-filter: blur(4px);
            display: inline-flex;
            align-items: center;
            gap: 5px;
        }

        .time-text {
            font-size: 11px;
            color: var(--text-sub);
            font-family: 'Inter', sans-serif;
        }

        .empty-state {
            display: none;
            text-align: center;
            color: var(--text-sub);
            padding-top: 40px;
            font-size: 14px;
        }

        .fab-btn {
            position: fixed;
            bottom: calc(35px + var(--safe-area-bottom));
            right: 24px;
            width: 64px;
            height: 64px;
            border-radius: 50%;
            background: var(--bg-main);
            border: 1px solid rgba(var(--c-blue), 0.5);
            box-shadow: 0 6px 20px rgba(0, 0, 0, 0.4), 0 0 15px rgba(var(--c-blue), 0.3);
            display: flex;
            align-items: center;
            justify-content: center;
            color: rgb(var(--c-blue));
            font-size: 22px;
            z-index: 99;
            animation: pulse-blue 3s infinite;
            transition: transform 0.2s, background-color 0.3s;
            cursor: pointer;
        }

        .fab-btn:active {
            transform: scale(0.92);
            box-shadow: 0 0 25px rgba(var(--c-blue), 0.6);
            border-color: rgba(var(--c-blue), 1);
        }

        /* 模态框 */
        .modal-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.7);
            backdrop-filter: blur(5px);
            z-index: 200;
            display: none;
            opacity: 0;
            transition: opacity 0.3s;
            align-items: center;
            justify-content: center;
        }

        .modal-overlay.show {
            display: flex;
            opacity: 1;
        }

        .modal-content {
            background: var(--modal-bg);
            width: 85%;
            max-width: 340px;
            border-radius: 8px;
            border: 1px solid var(--border-color);
            padding: 24px;
            box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
            transform: translateY(20px);
            transition: transform 0.3s, background-color 0.3s;
        }

        .modal-overlay.show .modal-content {
            transform: translateY(0);
        }

        .modal-title {
            font-family: 'Playfair Display', serif;
            font-size: 20px;
            font-weight: 600;
            color: var(--text-main);
            margin-bottom: 24px;
            text-align: center;
        }

        .input-group {
            margin-bottom: 20px;
        }

        .modal-input,
        .modal-textarea,
        .category-select {
            width: 100%;
            background: var(--input-bg);
            border: 1px solid var(--border-color);
            border-radius: 4px;
            padding: 12px;
            color: var(--text-main);
            font-family: 'Inter', sans-serif;
            font-size: 14px;
            transition: all 0.3s;
            appearance: none;
        }

        .modal-input:focus,
        .modal-textarea:focus,
        .category-select:focus {
            border-color: rgba(var(--c-gold), 0.5);
            background: rgba(var(--c-gold), 0.05);
        }

        .modal-textarea {
            min-height: 100px;
            resize: vertical;
        }

        .color-grid {
            display: grid;
            grid-template-columns: repeat(5, 1fr);
            gap: 12px;
            margin-bottom: 24px;
        }

        .color-option {
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            transition: transform 0.2s;
            position: relative;
        }

        .color-option.selected::after {
            content: '';
            position: absolute;
            top: -4px;
            left: -4px;
            width: 38px;
            height: 38px;
            border-radius: 50%;
            border: 2px solid var(--text-main);
        }

        .bg-gold {
            background: rgb(var(--c-gold));
        }

        .bg-blue {
            background: rgb(var(--c-blue));
        }

        .bg-crimson {
            background: rgb(var(--c-crimson));
        }

        .bg-purple {
            background: rgb(var(--c-purple));
        }

        .bg-emerald {
            background: rgb(var(--c-emerald));
        }

        .bg-silver {
            background: rgb(var(--c-silver));
        }

        .bg-turquoise {
            background: rgb(var(--c-turquoise));
        }

        .bg-amber {
            background: rgb(var(--c-amber));
        }

        .bg-ruby {
            background: rgb(var(--c-ruby));
        }

        .bg-peridot {
            background: rgb(var(--c-peridot));
        }

        .modal-actions {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 30px;
        }

        .modal-right-btns {
            display: flex;
            gap: 12px;
        }

        .btn-text {
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 14px;
            cursor: pointer;
            padding: 8px 16px;
        }

        .btn-primary {
            background: var(--text-main);
            color: var(--bg-main);
            border: none;
            padding: 8px 20px;
            border-radius: 4px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
            transition: opacity 0.2s;
        }

        .btn-primary:active {
            opacity: 0.8;
        }

        .btn-delete {
            background: none;
            border: none;
            color: rgb(var(--c-crimson));
            font-size: 12px;
            cursor: pointer;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.3s;
            display: flex;
            align-items: center;
            gap: 4px;
        }

        .btn-delete.visible {
            opacity: 1;
            pointer-events: auto;
        }

        /* 搜索样式 */
        .search-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: var(--bg-main);
            z-index: 300;
            padding: 80px 24px;
            transform: translateY(100%);
            transition: transform 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            display: flex;
            flex-direction: column;
        }

        .search-overlay.show {
            transform: translateY(0);
        }

        .close-search {
            position: absolute;
            top: 24px;
            right: 24px;
            background: none;
            border: none;
            color: var(--text-sub);
            font-size: 24px;
            cursor: pointer;
        }

        .search-box {
            width: 100%;
            background: transparent;
            border: none;
            border-bottom: 1px solid var(--border-color);
            padding: 15px 0;
            font-family: 'Playfair Display', serif;
            font-size: 24px;
            color: var(--text-main);
            margin-bottom: 30px;
        }

        .search-results {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 16px;
        }
    </style>
</head>

<body>

    <div class="ambient-top"></div>
    <div class="ambient-bottom"></div>

    <header>
        <div class="brand">
            <span class="brand-subtitle">PRIVATE WORKSPACE</span>
            <span class="brand-title">M System</span>
        </div>
        <div class="header-actions">
            <div class="icon-btn" id="searchBtn">
                <i class="fas fa-search"></i>
            </div>
            <div class="icon-btn" id="themeToggleBtn">
                <i class="fas fa-moon"></i>
            </div>
        </div>
    </header>

    <div class="filter-scroll" id="filterScroll">
        <div class="add-tag-btn" id="addTagBtn">
            <i class="fas fa-plus"></i>
        </div>
    </div>

    <div class="list-container" id="cardList">
        <div class="empty-state" id="emptyState">
            <i class="fas fa-wind" style="font-size: 24px; margin-bottom: 10px; opacity: 0.5;"></i>
            <p>No items found.</p>
        </div>

        <!-- Logout Button at the bottom -->
        <div style="text-align: center; margin-top: 40px; padding-bottom: 20px;">
            <button id="logoutBtnBottom"
                style="background: none; border: 1px solid var(--border-color); color: var(--text-sub); padding: 10px 24px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.3s;">
                <i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i> Log Out
            </button>
        </div>
    </div>

    <button class="fab-btn" id="fabBtn"><i class="fas fa-plus"></i></button>

    <!-- 分类模态框 -->
    <div class="modal-overlay" id="tagModal">
        <div class="modal-content">
            <div class="modal-title" id="tagModalTitle">New Label</div>
            <div class="input-group">
                <input type="text" class="modal-input" id="tagNameInput" placeholder="Enter tag name...">
            </div>
            <div class="color-grid" id="colorGrid">
                <div class="color-option bg-gold selected" data-color="gold"></div>
                <div class="color-option bg-blue" data-color="blue"></div>
                <div class="color-option bg-crimson" data-color="crimson"></div>
                <div class="color-option bg-purple" data-color="purple"></div>
                <div class="color-option bg-emerald" data-color="emerald"></div>
                <div class="color-option bg-silver" data-color="silver"></div>
                <div class="color-option bg-turquoise" data-color="turquoise"></div>
                <div class="color-option bg-amber" data-color="amber"></div>
                <div class="color-option bg-ruby" data-color="ruby"></div>
                <div class="color-option bg-peridot" data-color="peridot"></div>
            </div>
            <div class="modal-actions">
                <button class="btn-delete" id="deleteTagBtn"><i class="fas fa-trash"></i> Delete</button>
                <div class="modal-right-btns">
                    <button class="btn-text" id="cancelTagBtn">Cancel</button>
                    <button class="btn-primary" id="saveTagBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 卡片模态框 -->
    <div class="modal-overlay" id="cardModal">
        <div class="modal-content">
            <div class="modal-title" id="cardModalTitle">New Card</div>
            <div class="input-group">
                <input type="text" class="modal-input" id="cardTitleInput" placeholder="Card title...">
            </div>
            <div class="input-group">
                <textarea class="modal-textarea" id="cardContentInput" placeholder="Card content..."></textarea>
            </div>
            <div class="input-group">
                <select class="category-select" id="cardCategorySelect">
                    <option value="">Select category...</option>
                </select>
            </div>
            <div class="modal-actions">
                <button class="btn-delete" id="deleteCardBtn"><i class="fas fa-trash"></i> Delete</button>
                <div class="modal-right-btns">
                    <button class="btn-text" id="cancelCardBtn">Cancel</button>
                    <button class="btn-primary" id="saveCardBtn">Save</button>
                </div>
            </div>
        </div>
    </div>

    <!-- 搜索覆盖层 -->
    <div class="search-overlay" id="searchOverlay">
        <button class="close-search" id="closeSearch"><i class="fas fa-times"></i></button>
        <input type="text" class="search-box" id="searchBox" placeholder="Search cards...">
        <div class="search-results" id="searchResults"></div>
    </div>

    <script src="./api.js"></script>
    <script>
        // 检查登录状态
        if (localStorage.getItem('isAuthenticated') !== 'true') {
            window.location.href = '/login.html';
        }

        // 全局变量
        let categories = [];
        let cards = [];
        let currentFilter = 'all';
        let editingCategoryIndex = -1;
        let editingCardId = null;
        let selectedColor = 'gold';

        // DOM 元素
        const filterScroll = document.getElementById('filterScroll');
        const addTagBtn = document.getElementById('addTagBtn');
        const cardList = document.getElementById('cardList');
        const emptyState = document.getElementById('emptyState');
        const fabBtn = document.getElementById('fabBtn');
        const themeToggleBtn = document.getElementById('themeToggleBtn');
        const logoutBtnBottom = document.getElementById('logoutBtnBottom');
        const searchBtn = document.getElementById('searchBtn');

        // 分类模态框
        const tagModal = document.getElementById('tagModal');
        const tagModalTitle = document.getElementById('tagModalTitle');
        const tagNameInput = document.getElementById('tagNameInput');
        const colorOptions = document.querySelectorAll('.color-option');
        const cancelTagBtn = document.getElementById('cancelTagBtn');
        const saveTagBtn = document.getElementById('saveTagBtn');
        const deleteTagBtn = document.getElementById('deleteTagBtn');

        // 卡片模态框
        const cardModal = document.getElementById('cardModal');
        const cardModalTitle = document.getElementById('cardModalTitle');
        const cardTitleInput = document.getElementById('cardTitleInput');
        const cardContentInput = document.getElementById('cardContentInput');
        const cardCategorySelect = document.getElementById('cardCategorySelect');
        const cancelCardBtn = document.getElementById('cancelCardBtn');
        const saveCardBtn = document.getElementById('saveCardBtn');
        const deleteCardBtn = document.getElementById('deleteCardBtn');

        // 搜索
        const searchOverlay = document.getElementById('searchOverlay');
        const searchBox = document.getElementById('searchBox');
        const searchResults = document.getElementById('searchResults');
        const closeSearch = document.getElementById('closeSearch');

        // 初始化
        async function init() {
            try {
                initTheme();
                await loadCategories();
                await loadCards();
                renderCategories();
                renderCards();
            } catch (error) {
                console.error('Initialization error:', error);
                alert('Failed to load data. Please refresh the page.');
            }
        }

        // Theme Handling
        function initTheme() {
            const savedTheme = localStorage.getItem('theme') || 'dark';
            if (savedTheme === 'light') {
                document.body.classList.add('light-mode');
                themeToggleBtn.innerHTML = '<i class="fas fa-sun"></i>';
            } else {
                document.body.classList.remove('light-mode');
                themeToggleBtn.innerHTML = '<i class="fas fa-moon"></i>';
            }
        }

        themeToggleBtn.addEventListener('click', () => {
            document.body.classList.toggle('light-mode');
            const isLight = document.body.classList.contains('light-mode');
            localStorage.setItem('theme', isLight ? 'light' : 'dark');
            themeToggleBtn.innerHTML = isLight ? '<i class="fas fa-sun"></i>' : '<i class="fas fa-moon"></i>';
        });

        // 加载分类
        async function loadCategories() {
            try {
                categories = await api.getCategories();
                // 添加 "All" 分类
                categories.unshift({ id: 'all', name: 'Overview' });
            } catch (error) {
                console.error('Failed to load categories:', error);
                categories = [{ id: 'all', name: 'Overview' }];
            }
        }

        // 加载卡片
        async function loadCards() {
            try {
                cards = await api.getCards();
            } catch (error) {
                console.error('Failed to load cards:', error);
                cards = [];
            }
        }

        // 渲染分类
        function renderCategories() {
            const existingItems = filterScroll.querySelectorAll('.filter-item');
            existingItems.forEach(el => el.remove());

            categories.forEach((category, index) => {
                const color = category.id === 'all' ? 'gold' : colorManager.getColor(category.id);
                const el = document.createElement('div');
                el.className = `filter-item ${index === 0 ? 'active-' + color : ''}`;
                el.setAttribute('data-filter', category.id);
                el.setAttribute('data-color', color);
                el.innerText = category.name;

                filterScroll.insertBefore(el, addTagBtn);

                el.addEventListener('click', () => handleFilterClick(el, category.id));

                if (category.id !== 'all') {
                    let pressTimer;
                    el.addEventListener('touchstart', (e) => {
                        pressTimer = setTimeout(() => {
                            if (navigator.vibrate) navigator.vibrate(50);
                            openTagModal(index);
                        }, 600);
                    });
                    el.addEventListener('touchend', () => clearTimeout(pressTimer));
                    el.addEventListener('touchmove', () => clearTimeout(pressTimer));
                    el.addEventListener('contextmenu', (e) => {
                        e.preventDefault();
                        openTagModal(index);
                    });
                }
            });

            updateCategorySelect();
        }

        // 更新分类下拉框
        function updateCategorySelect() {
            cardCategorySelect.innerHTML = '<option value="">Select category...</option>';
            categories.forEach(cat => {
                if (cat.id !== 'all') {
                    const option = document.createElement('option');
                    option.value = cat.id;
                    option.textContent = cat.name;
                    cardCategorySelect.appendChild(option);
                }
            });
        }

        // 渲染卡片
        function renderCards() {
            // Sort cards by updated_at (descending), fallback to created_at
            const sortedCards = [...cards].sort((a, b) => {
                const timeA = new Date(a.updated_at || a.created_at).getTime();
                const timeB = new Date(b.updated_at || b.created_at).getTime();
                return timeB - timeA;
            });

            const filteredCards = currentFilter === 'all'
                ? sortedCards
                : sortedCards.filter(card => card.category_id == currentFilter);

            // Clear card list but keep the logout button container
            // To do this cleanly, we'll clear everything and re-append
            cardList.innerHTML = '';
            let visibleCount = 0;

            if (filteredCards.length === 0) {
                emptyState.style.display = 'block';
                cardList.appendChild(emptyState);
            } else {
                emptyState.style.display = 'none';
                filteredCards.forEach((card, index) => {
                    visibleCount++;
                    const category = categories.find(c => c.id == card.category_id);
                    const color = category ? colorManager.getColor(category.id) : 'gold'; // Default to gold if uncategorized
                    const categoryName = category ? category.name : 'DEFAULT';

                    const el = document.createElement('div');
                    el.className = `card accent-${color} fade-in`;
                    el.style.animationDelay = `${index * 0.05}s`;
                    el.onclick = (e) => {
                        if (!e.target.closest('.card-icon')) {
                            openCardModal(card.id);
                        }
                    };

                    const isStarred = card.is_favorite ? 'starred' : '';
                    const starIcon = card.is_favorite ? 'fas fa-star' : 'far fa-star';

                    // Format time
                    const timeStr = formatTime(card.updated_at || card.created_at);

                    el.innerHTML = `
                        <div class="card-top">
                            <div class="card-title">${escapeHtml(card.title || '(No Title)')}</div>
                            <i class="${starIcon} card-icon ${isStarred}" onclick="toggleStar(event, ${card.id})"></i>
                        </div>
                        <div class="card-body">${escapeHtml(card.content || '')}</div>
                        <div class="card-meta">
                            <div class="tag-pill tag-${color}">
                                <i class="fas fa-tag" style="font-size: 8px;"></i> ${categoryName}
                            </div>
                            <div class="time-text">${timeStr}</div>
                        </div>
                    `;
                    cardList.appendChild(el);
                });
            }

            // Re-append logout button container
            const logoutContainer = document.createElement('div');
            logoutContainer.style.cssText = "text-align: center; margin-top: 40px; padding-bottom: 20px;";
            logoutContainer.innerHTML = `
                <button id="logoutBtnBottom" style="background: none; border: 1px solid var(--border-color); color: var(--text-sub); padding: 10px 24px; border-radius: 20px; font-size: 12px; cursor: pointer; transition: all 0.3s;">
                    <i class="fas fa-sign-out-alt" style="margin-right: 6px;"></i> Log Out
                </button>
            `;
            cardList.appendChild(logoutContainer);

            // Re-bind event listener since we recreated the button
            document.getElementById('logoutBtnBottom').addEventListener('click', handleLogout);
        }

        function handleLogout() {
            if (confirm('Are you sure you want to log out?')) {
                localStorage.removeItem('isAuthenticated');
                window.location.href = '/login.html';
            }
        }

        // Helper to format time
        function formatTime(isoString) {
            if (!isoString) return '';
            const date = new Date(isoString);
            const now = new Date();
            const diff = now - date;

            // If less than 24 hours, show time
            if (diff < 24 * 60 * 60 * 1000 && now.getDate() === date.getDate()) {
                return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
            }
            // Otherwise show date
            return date.toLocaleDateString();
        }

        // Toggle Star
        window.toggleStar = async function (e, cardId) {
            e.stopPropagation();
            const card = cards.find(c => c.id === cardId);
            if (!card) return;

            const starIcon = e.target;

            try {
                starIcon.classList.remove('star-anim');
                void starIcon.offsetWidth;
                starIcon.classList.add('star-anim');

                const newFavoriteStatus = !card.is_favorite;
                await api.updateCard(cardId, { is_favorite: newFavoriteStatus });

                card.is_favorite = newFavoriteStatus;

                // Re-render to update UI (or manually update class for performance)
                if (newFavoriteStatus) {
                    starIcon.className = 'fas fa-star card-icon starred star-anim';
                } else {
                    starIcon.className = 'far fa-star card-icon star-anim';
                }
            } catch (error) {
                console.error('Failed to toggle favorite:', error);
                alert('Failed to update favorite status');
            }
        }

        // 筛选点击
        function handleFilterClick(el, categoryId) {
            currentFilter = categoryId;

            // Update UI
            document.querySelectorAll('.filter-item').forEach(item => {
                const color = item.getAttribute('data-color');
                item.className = `filter-item`;
            });

            const color = el.getAttribute('data-color');
            el.className = `filter-item active-${color}`;

            renderCards();
        }

        // 打开分类模态框
        function openTagModal(index = -1) {
            tagModal.classList.add('show');
            editingCategoryIndex = index;

            if (index === -1) {
                tagModalTitle.innerText = "New Label";
                saveTagBtn.innerText = "Create";
                tagNameInput.value = '';
                selectedColor = 'gold';
                deleteTagBtn.classList.remove('visible');
                updateColorSelection('gold');
            } else {
                const category = categories[index];
                tagModalTitle.innerText = "Edit Label";
                saveTagBtn.innerText = "Update";
                tagNameInput.value = category.name;
                selectedColor = colorManager.getColor(category.id);
                deleteTagBtn.classList.add('visible');
                updateColorSelection(selectedColor);
            }

            if (window.innerWidth > 500) tagNameInput.focus();
        }

        function updateColorSelection(color) {
            colorOptions.forEach(opt => opt.classList.remove('selected'));
            const target = document.querySelector(`.color-option[data-color="${color}"]`);
            if (target) target.classList.add('selected');
        }

        function closeTagModal() {
            tagModal.classList.remove('show');
        }

        // 保存分类
        saveTagBtn.addEventListener('click', async () => {
            const name = tagNameInput.value.trim();
            if (!name) return;

            try {
                if (editingCategoryIndex === -1) {
                    // 创建新分类
                    const newCategory = await api.createCategory(name);
                    colorManager.setColor(newCategory.id, selectedColor);
                    await loadCategories();
                } else {
                    // 更新分类
                    const category = categories[editingCategoryIndex];
                    await api.updateCategory(category.id, name);
                    colorManager.setColor(category.id, selectedColor);
                    await loadCategories();
                }

                renderCategories();
                closeTagModal();

                if (editingCategoryIndex === -1) {
                    setTimeout(() => filterScroll.scrollLeft = filterScroll.scrollWidth, 100);
                }
            } catch (error) {
                console.error('Failed to save category:', error);
                alert('Failed to save category');
            }
        });

        // 删除分类
        deleteTagBtn.addEventListener('click', async () => {
            if (editingCategoryIndex > -1) {
                if (confirm('Delete this label? All cards in this category will remain but be uncategorized.')) {
                    try {
                        const category = categories[editingCategoryIndex];
                        await api.deleteCategory(category.id);
                        colorManager.deleteColor(category.id);
                        await loadCategories();
                        renderCategories();
                        closeTagModal();
                        currentFilter = 'all';
                        renderCards();
                    } catch (error) {
                        console.error('Failed to delete category:', error);
                        alert('Failed to delete category');
                    }
                }
            }
        });

        cancelTagBtn.addEventListener('click', closeTagModal);
        tagModal.addEventListener('click', (e) => { if (e.target === tagModal) closeTagModal(); });
        addTagBtn.addEventListener('click', () => openTagModal(-1));

        colorOptions.forEach(opt => {
            opt.addEventListener('click', () => {
                selectedColor = opt.getAttribute('data-color');
                updateColorSelection(selectedColor);
            });
        });

        // 打开卡片模态框
        function openCardModal(cardId = null) {
            cardModal.classList.add('show');
            editingCardId = cardId;

            if (cardId === null) {
                cardModalTitle.innerText = "New Card";
                saveCardBtn.innerText = "Create";
                cardTitleInput.value = '';
                cardContentInput.value = '';
                cardCategorySelect.value = currentFilter === 'all' ? '' : currentFilter;
                deleteCardBtn.classList.remove('visible');
            } else {
                const card = cards.find(c => c.id === cardId);
                if (card) {
                    cardModalTitle.innerText = "Edit Card";
                    saveCardBtn.innerText = "Update";
                    cardTitleInput.value = card.title;
                    cardContentInput.value = card.content;
                    cardCategorySelect.value = card.category_id || '';
                    deleteCardBtn.classList.add('visible');
                }
            }

            if (window.innerWidth > 500) cardTitleInput.focus();
        }

        function closeCardModal() {
            cardModal.classList.remove('show');
        }

        // 保存卡片
        saveCardBtn.addEventListener('click', async () => {
            const title = cardTitleInput.value.trim();
            const content = cardContentInput.value.trim();
            const categoryId = cardCategorySelect.value;

            if (!title && !content) {
                alert('Please fill in at least title or content');
                return;
            }

            try {
                const cardData = {
                    title,
                    content,
                    category_id: categoryId ? parseInt(categoryId) : null,
                    is_favorite: false
                };

                if (editingCardId === null) {
                    await api.createCard(cardData);
                } else {
                    await api.updateCard(editingCardId, cardData);
                }

                await loadCards();
                renderCards();
                closeCardModal();
            } catch (error) {
                console.error('Failed to save card:', error);
                alert('Failed to save card');
            }
        });

        // 删除卡片
        deleteCardBtn.addEventListener('click', async () => {
            if (editingCardId && confirm('Delete this card?')) {
                try {
                    await api.deleteCard(editingCardId);
                    await loadCards();
                    renderCards();
                    closeCardModal();
                } catch (error) {
                    console.error('Failed to delete card:', error);
                    alert('Failed to delete card');
                }
            }
        });

        cancelCardBtn.addEventListener('click', closeCardModal);
        cardModal.addEventListener('click', (e) => { if (e.target === cardModal) closeCardModal(); });
        fabBtn.addEventListener('click', () => openCardModal(null));

        // 搜索功能
        searchBtn.addEventListener('click', () => {
            searchOverlay.classList.add('show');
            searchBox.focus();
        });

        closeSearch.addEventListener('click', () => {
            searchOverlay.classList.remove('show');
            searchBox.value = '';
            searchResults.innerHTML = '';
        });

        searchBox.addEventListener('input', (e) => {
            const query = e.target.value.toLowerCase().trim();
            searchResults.innerHTML = '';

            if (!query) return;

            const results = cards.filter(card =>
                (card.title && card.title.toLowerCase().includes(query)) ||
                (card.content && card.content.toLowerCase().includes(query))
            );

            results.forEach(card => {
                const cardEl = createCardElement(card);
                searchResults.appendChild(cardEl);
            });

            if (results.length === 0) {
                searchResults.innerHTML = '<div class="empty-state" style="display:block;">No results found</div>';
            }
        });

        // Helper to create card element for search results
        function createCardElement(card) {
            const category = categories.find(c => c.id == card.category_id);
            const color = category ? colorManager.getColor(category.id) : 'gold';

            const el = document.createElement('div');
            el.className = `card accent-${color}`;
            el.onclick = () => {
                openCardModal(card.id);
                searchOverlay.classList.remove('show');
            };

            el.innerHTML = `
                <div class="card-top">
                    <div class="card-title">${escapeHtml(card.title || '(No Title)')}</div>
                </div>
                <div class="card-body">${escapeHtml(card.content || '')}</div>
            `;
            return el;
        }

        // HTML 转义
        function escapeHtml(text) {
            if (!text) return '';
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        // 启动应用
        init();
    </script>
